plugins {
    id 'com.android.application'
}

android {
    namespace 'edu.aiou.hostel'
    compileSdk 34

    defaultConfig {
        applicationId "edu.aiou.hostel"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
